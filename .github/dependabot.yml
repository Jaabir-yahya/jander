# Dependabot configuration for security updates
# This helps keep dependencies up to date

version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/apps/whatsapp-business"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/apps/scripts"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore"
      include: "scope"

